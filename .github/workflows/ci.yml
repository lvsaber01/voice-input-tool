name: CI - Cross Platform Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest
    
    defaults:
      run:
        shell: bash
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_windows.txt
        pip install pytest
    
    - name: Syntax check
      run: |
        python -m py_compile config.py
        python -m py_compile main.py
        python -m py_compile core/engine.py
        python -m py_compile core/recorder.py
        python -m py_compile core/silence_detector.py
        python -m py_compile core/stt_engine.py
        python -m py_compile core/injector.py
        python -m py_compile core/hotkey.py
        python -m py_compile core/sound_player.py
        python -m py_compile core/streaming_transcriber.py
        python -m py_compile gui/tray.py
        python -m py_compile gui/web_server.py
        python -m py_compile platform_adapter/__init__.py
        python -m py_compile platform_adapter/hotkey_base.py
        python -m py_compile platform_adapter/hotkey_windows.py
        python -m py_compile platform_adapter/clipboard_base.py
        python -m py_compile platform_adapter/clipboard_windows.py
        echo "Syntax check PASSED"
    
    - name: Import test
      run: |
        python -c "from config import load_config, save_config, AppConfig, RealtimeConfig; print('config.py OK')"
        python -c "from core.engine import EngineState, CoreEngine; print('engine.py OK')"
        python -c "from core.streaming_transcriber import StreamTranscriber; print('streaming_transcriber.py OK')"
        python -c "from core.recorder import AudioRecorder; print('recorder.py OK')"
        python -c "from core.stt_engine import STTEngine; assert hasattr(STTEngine, 'transcribe_sync'); print('stt_engine.py OK')"
        python -c "from core.injector import TextInjector; print('injector.py OK')"
        python -c "from core.hotkey import HotkeyManager; print('hotkey.py OK')"
        python -c "from platform_adapter import CURRENT_PLATFORM, create_hotkey_manager, create_clipboard_injector; print('platform_adapter OK')"
        python -c "from platform_adapter.hotkey_windows import WindowsHotkeyManager; print('hotkey_windows OK')"
        python -c "from platform_adapter.clipboard_windows import WindowsClipboardInjector; print('clipboard_windows OK')"
    
    - name: Config integration test
      run: |
        python << 'EOF'
        import os, tempfile
        from config import load_config, save_config, AppConfig

        tmp = tempfile.mkdtemp()
        cfg_path = os.path.join(tmp, 'test_config.yaml')
        cfg = load_config(cfg_path)
        assert isinstance(cfg, AppConfig)
        assert cfg.hotkey.trigger == 'f8'
        assert cfg.config_version == 2
        assert hasattr(cfg, 'mode')
        assert cfg.mode == 'batch'
        assert hasattr(cfg, 'realtime')

        cfg.hotkey.trigger = 'f9'
        cfg.mode = 'realtime'
        save_config(cfg_path, cfg)
        cfg2 = load_config(cfg_path)
        assert cfg2.hotkey.trigger == 'f9'
        assert cfg2.mode == 'realtime'

        print('Config load/save test PASSED')
        EOF

    - name: Engine state machine test
      run: |
        python << 'EOF'
        import threading
        from core.engine import EngineState, CoreEngine
        from unittest.mock import MagicMock

        assert hasattr(EngineState, 'STREAMING')

        engine = CoreEngine.__new__(CoreEngine)
        engine._state = EngineState.IDLE
        engine._state_lock = threading.Lock()
        engine._shutdown_event = threading.Event()
        engine._tray = MagicMock()

        import core.engine as engine_mod
        transitions = engine_mod._VALID_TRANSITIONS
        assert EngineState.STREAMING in transitions
        assert EngineState.IDLE in transitions[EngineState.STREAMING]
        assert EngineState.STREAMING in transitions[EngineState.IDLE]
        print('Engine state machine test PASSED')
        EOF

    - name: Module tests
      run: |
        python << 'EOF'
        import queue
        from core.recorder import AudioRecorder
        from core.silence_detector import SilenceDetector
        from core.stt_engine import STTEngine
        from config import AudioConfig, STTConfig, RealtimeConfig

        # Recorder
        rec = AudioRecorder(AudioConfig())
        assert rec.SAMPLE_RATE == 16000
        assert not rec.is_recording

        # SilenceDetector
        called = []
        detector = SilenceDetector(AudioConfig(), lambda: called.append(True))
        q = queue.Queue()
        detector.start(q)
        detector.begin_detection()
        assert detector._detecting
        detector.end_detection()
        assert not detector._detecting
        detector.shutdown()

        # STT Engine
        engine = STTEngine(STTConfig())
        assert engine.model is None
        assert hasattr(engine, 'transcribe_sync')

        # RealtimeConfig
        rt = RealtimeConfig()
        assert rt.segment_pause_threshold == 0.8
        assert rt.vad_sensitivity == 2

        print('Module tests PASSED')
        EOF

  test-macos-imports:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_macos.txt
    
    - name: macOS import test
      run: |
        python -c "from platform_adapter import CURRENT_PLATFORM; assert CURRENT_PLATFORM == 'macos'; print('Platform OK')"
        python -c "from platform_adapter.hotkey_macos import MacOSHotkeyManager; print('hotkey_macos OK')"
        python -c "from platform_adapter.clipboard_macos import MacOSClipboardInjector; print('clipboard_macos OK')"
        python -c "from platform_adapter.hotkey_base import HotkeyManagerBase; print('hotkey_base OK')"
        python -c "from platform_adapter.clipboard_base import ClipboardInjectorBase; print('clipboard_base OK')"
        python -c "from core.streaming_transcriber import StreamTranscriber; print('streaming_transcriber OK')"
