name: Build Windows Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # 使用 3.11 而非 3.13（更稳定）
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt
        pip install -r requirements_windows.txt
        pip install "ctranslate2>=4.0,<5.0" "faster-whisper>=1.1.0"
    
    - name: Verify faster-whisper
      run: |
        python -c "from faster_whisper import WhisperModel; print('faster-whisper OK')"
        python -c "import ctranslate2; print(f'ctranslate2 {ctranslate2.__version__}')"
    
    - name: Create placeholder icon
      shell: cmd
      run: |
        mkdir build 2>nul
        python -c "from PIL import Image; img = Image.new('RGB', (256, 256), (30, 144, 255)); img.save('build/icon.ico', 'ICO')"
        if exist build\icon.ico echo Icon created
    
    - name: Build with PyInstaller
      run: |
        pyinstaller voice-input-tool.spec --noconfirm --clean
    
    - name: Create release package
      shell: cmd
      run: |
        cd dist
        7z a VoiceInputTool-Windows.zip VoiceInputTool -mx=5
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceInputTool-Windows
        path: dist/VoiceInputTool-Windows.zip
        retention-days: 30
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: build/*.log

  build-source:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Create source package
      run: |
        mkdir -p dist/VoiceInputTool-Source
        # 复制源码
        cp -r main.py config.py core/ gui/ platform_adapter/ dist/VoiceInputTool-Source/
        # 复制配置和依赖
        cp requirements.txt requirements_windows.txt config.example.yaml dist/VoiceInputTool-Source/
        [ -f requirements_macos.txt ] && cp requirements_macos.txt dist/VoiceInputTool-Source/
        cp -r models/ dist/VoiceInputTool-Source/ 2>/dev/null || mkdir -p dist/VoiceInputTool-Source/models && cp models/README.md dist/VoiceInputTool-Source/models/ 2>/dev/null || true
        # 复制启动脚本
        cp start.bat start.sh setup_full.bat run_full.bat dist/VoiceInputTool-Source/
        # 复制 spec 和 hooks（供手动 exe 打包用）
        cp -r voice-input-tool.spec build/ dist/VoiceInputTool-Source/
        # 打包
        cd dist
        zip -r VoiceInputTool-Source.zip VoiceInputTool-Source/
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceInputTool-Source
        path: dist/VoiceInputTool-Source.zip
        retention-days: 30

  test-windows:
    needs: build-windows
    runs-on: windows-latest
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: VoiceInputTool-Windows
    
    - name: Extract and test
      shell: cmd
      run: |
        7z x VoiceInputTool-Windows.zip -o.
        cd VoiceInputTool
        echo Testing exe startup...
        start VoiceInputTool.exe
        timeout /t 5 /nobreak >nul
        taskkill /im VoiceInputTool.exe /f 2>nul
        echo Test complete